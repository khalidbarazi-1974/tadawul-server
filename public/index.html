<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة الشؤون الاقتصادية والتميز</title>
    <link rel="stylesheet" href="/vendor/fonts/cairo.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            color: #1a237e;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1a237e;
            background: white;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a237e, #1565c0);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }

        /* Dashboard */
        #dashboard { display: none; }

        .topbar {
            background: #1a237e;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 { font-size: 20px; }

        .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 14px; }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .btn-logout:hover { background: rgba(255,255,255,0.3); }

        .content { padding: 32px; max-width: 1200px; margin: 0 auto; }

        .welcome-card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .welcome-card h3 { color: #1a237e; font-size: 22px; margin-bottom: 8px; }
        .welcome-card p { color: #666; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .stat-card .num { font-size: 36px; font-weight: 700; color: #1a237e; }
        .stat-card .lbl { color: #666; font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginPage">
    <div class="login-card">
        <div class="logo">
            <h1>وكالة الشؤون الاقتصادية والتميز</h1>
            <p>الهيئة السعودية للمياه</p>
        </div>

        <div class="form-group">
            <label>الرقم الوظيفي</label>
            <input type="text" id="empId" placeholder="مثال: U291640" autocomplete="off">
        </div>

        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">دخول</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
    <div class="topbar">
        <h2>وكالة الشؤون الاقتصادية والتميز</h2>
        <div class="topbar-right">
            <span id="userName"></span>
            <span id="userRole"></span>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>
    <div class="content">
        <div class="welcome-card">
            <h3 id="welcomeMsg"></h3>
            <p id="deptName"></p>
        </div>
        <div class="stats" id="statsGrid"></div>
    </div>
</div>

<script>
    const API = '/api';

    function getToken() { return sessionStorage.getItem('token'); }
    function getUser()  { return JSON.parse(sessionStorage.getItem('user') || 'null'); }

    async function login() {
        const employeeId = document.getElementById('empId').value.trim();
        const password   = document.getElementById('password').value;
        const btn        = document.getElementById('loginBtn');
        const err        = document.getElementById('errorMsg');

        if (!employeeId || !password) {
            showError('يرجى إدخال الرقم الوظيفي وكلمة المرور');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'جاري الدخول...';
        err.style.display = 'none';

        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employeeId, password })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'خطأ في الدخول');

            sessionStorage.setItem('token', data.token);
            sessionStorage.setItem('user', JSON.stringify(data.user));
            location.href = '/hub.html';
        } catch (e) {
            showError(e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'دخول';
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.textContent = msg;
        err.style.display = 'block';
    }

    async function showDashboard(user) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.body.style.background = '#f0f2f5';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent =
            user.role === 'manager' ? '(مدير)' : '(موظف)';
        document.getElementById('welcomeMsg').textContent = `مرحباً، ${user.name}`;

        const depts = await apiFetch('/departments');
        const dept = depts.find(d => d.id === user.deptId);
        document.getElementById('deptName').textContent = dept ? dept.name : '';

        const tasks = await apiFetch(`/tasks/dept/${user.deptId}`);
        const pending  = tasks.filter(t => t.guidances.some(g => g.addedBy && !g.approved)).length;
        const inProgress = tasks.filter(t => t.status === 'قيد التنفيذ').length;
        const done     = tasks.filter(t => t.status === 'مكتمل').length;

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="num">${tasks.length}</div><div class="lbl">إجمالي المواضيع</div></div>
            <div class="stat-card"><div class="num">${inProgress}</div><div class="lbl">قيد التنفيذ</div></div>
            <div class="stat-card"><div class="num">${done}</div><div class="lbl">مكتملة</div></div>
            <div class="stat-card"><div class="num">${pending}</div><div class="lbl">تعليقات بانتظار الاعتماد</div></div>
        `;
    }

    async function apiFetch(endpoint, options = {}) {
        const res = await fetch(`${API}${endpoint}`, {
            ...options,
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        if (!res.ok) throw new Error('خطأ في الاتصال');
        return res.json();
    }

    function logout() {
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('user');
        location.reload();
    }

    // Auto-login if token exists
    window.onload = () => {
        const user = getUser();
        if (user && getToken()) {
            location.href = '/hub.html';
        }

        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    };
</script>
</body>
</html>
